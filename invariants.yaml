schema: overlay-invariants/v1
items:
  - id: INV-unauth-no-grant
    text: A missing, forged, or kicked session cannot create a quote, order, or entitlement.
    function_ids:
      - AUTH-06
      - AUTH-04
      - ORDER-01
      - PAY-01
      - PAY-02
      - PAY-08
      - ML-FR-004
    span: interaction
  - id: INV-browser-not-price
    text: Quote and checkout amounts are computed on the server; the browser cannot set the price.
    function_ids:
      - PAY-01
      - PAY-03
      - PAY-09
    span: local
  - id: INV-one-charge
    text: Repeating a completed confirmation, an unmatched paid webhook, or a cancelled demo trial does not grant a second entitlement.
    function_ids:
      - PAY-04
      - PAY-05
      - PAY-10
      - TRIAL-02
    span: interaction
  - id: INV-expired-no-learn
    text: An entitlement whose validTo is in the past cannot pass entitlements/check or write a paid study event.
    function_ids:
      - ML-FR-004
      - PAY-09
    span: interaction
  - id: INV-media-before-commit
    text: Course media bytes, type, signature and raster decode are checked before VFS write and again before draft or publish commit. The browser cannot raise the cap or skip decode.
    function_ids:
      - CM-01
      - CM-02
      - CM-03
      - CM-05
    span: interaction
  - id: INV-media-authz
    text: A learner session, foreign origin, or unattached inactive expired media cannot read private course assets. Entitlement is computed on the server.
    function_ids:
      - CM-04
      - CM-07
    span: interaction
  - id: INV-no-external-write
    text: New lesson and cover writes cannot persist off-origin or COS URLs. Legacy HTTPS COS may render on read only.
    function_ids:
      - CM-06
    span: local
