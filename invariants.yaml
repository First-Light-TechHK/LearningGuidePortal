schema: overlay-invariants/v1
items:
  - id: INV-unauth-no-grant
    text: A missing, forged, or kicked session cannot create a quote, order, or entitlement.
    function_ids:
      - AUTH-06
      - AUTH-04
      - ORDER-01
      - PAY-01
      - PAY-02
      - PAY-08
      - ML-FR-004
    span: interaction
  - id: INV-browser-not-price
    text: Quote and checkout amounts are computed on the server; the browser cannot set the price.
    function_ids:
      - PAY-01
      - PAY-03
      - PAY-09
    span: local
  - id: INV-one-charge
    text: Repeating a completed confirmation, an unmatched paid webhook, or a cancelled demo trial does not grant a second entitlement.
    function_ids:
      - PAY-04
      - PAY-05
      - PAY-10
      - TRIAL-02
    span: interaction
  - id: INV-expired-no-learn
    text: An entitlement whose validTo is in the past cannot pass entitlements/check or write a paid study event.
    function_ids:
      - ML-FR-004
      - PAY-09
    span: interaction
  - id: INV-course-own-category
    text: A course surface shows that course's commercial category and locale label. A resolved portal id or slug wins over a conflicting legacy field and over a catalogue name. An opaque catalogue id keeps an exact commercial legacy category. A subject name is not the label. Empty membership is omitted, is not filled with European Humanities, and cannot be published. A category chip appears only when a published course has that membership.
    function_ids:
      - UC-PORTAL-CATEGORY
    span: local
