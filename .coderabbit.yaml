# https://docs.coderabbit.ai/getting-started/yaml-configuration
# GitHub App + Verify job (coderabbit.yml) both read this file from the branch under review.
language: "en-GB"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
