# Forge 薄配置（接入方文件；不要 vendor forge/）。
# A 路线：agent / 开发 PR → dev（CI required，无人批）；dev → main 由 forge promote 开升级 PR
# （1 人批 + CODEOWNERS，merge commit）。Ruleset 由 Ops 用 FORGE_GITHUB_TOKEN 跑 forge apply 落地。
# required_checks 是 PR 上的 check 名（CI job 名），不是 workflow 名。
schema: forge-config/v1
protect:
  - dev
  - main
agent_branch_prefixes:
  - cursor/
  - copilot/
  - agent/
deny_paths:
  - .github/workflows/
branches:
  dev:
    required_checks:
      - Typecheck
      - Lint
      - Build and test
      - overlay-check
      - forge-check
    approvals: 0
    code_owners: false
  main:
    required_checks:
      - Typecheck
      - Lint
      - Build and test
      - overlay-check
      - forge-check
    approvals: 1
    code_owners: true
    promote_from: dev
title:
  scopes: any
docs_sync:
  - paths: [suites/**, inbox/**, invariants.yaml, overlay.yaml, forge.yaml]
    require: [docs/phase1/overlay-forge-brief.md]
forbidden_live_repos: []
