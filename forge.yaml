# Forge 薄配置（接入方文件；不要 vendor forge/）。
# required_checks 是 CI job 名，不是 workflow 名 Verify。
# 不设 deny_paths：forge-v1.1.3 的默认仍是 .github/workflows/ci.yml。
# forge-v1.1.3 的 diff 起点是 protect 里第一个能解析到的 ref
# （origin/<name> 与 HEAD 的 merge-base）。fork 的 origin/main 已与本分支分叉，
# 按它算会把 upstream 改过、本分支没改的 ci.yml 算进来。把本 PR 的 base 放在
# main 前面，只改 diff 起点；main 仍在 protect 里，规则与原来相同。
# 不要对这份文件跑 forge apply：apply 会一并为下面第一条装 Ruleset。
schema: forge-config/v1
protect:
  - cursor/upstream-main-base-e93d
  - main
agent_branch_prefixes:
  - cursor/
  - copilot/
  - agent/
branches:
  cursor/upstream-main-base-e93d:
    required_checks:
      - Typecheck
      - Lint
      - Build and test
      - overlay-check
      - forge-check
    approvals: 1
    code_owners: false
  main:
    required_checks:
      - Typecheck
      - Lint
      - Build and test
      - overlay-check
      - forge-check
    approvals: 1
    code_owners: false
title:
  scopes: any
docs_sync:
  - paths: [suites/**, inbox/**, invariants.yaml, overlay.yaml, forge.yaml]
    require: [docs/phase1/overlay-forge-brief.md]
forbidden_live_repos: []
