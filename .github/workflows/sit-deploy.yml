# SIT only. Never runs on push. DEV auto-deploys from dev-deploy.yml.
# Gate before AWS: Verify / overlay-check / forge-check must be green for this SHA.
name: Deploy SIT
on:
  workflow_dispatch:
    inputs:
      deployment_source:
        description: App Runner source type already configured for SIT
        type: choice
        default: source
        options: [source, image]
permissions:
  contents: read
  actions: read
concurrency:
  group: learning-guide-sit-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require green Verify, overlay-check and forge-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Build and publish the exact source as an ECR image
        if: inputs.deployment_source == 'image'
        run: node scripts/publish-sit-image.mjs
      - name: Verify revision, deploy and await readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-sit.mjs
