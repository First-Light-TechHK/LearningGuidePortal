# Actions = tests only. Workflow name is Verify (not a TDD-branded lock).
# Job order is strict via needs: Typecheck → Lint → Build and test.
# Aligns with cloud shape: node:22 + npm ci + npm run build + next start -p 8080.
# This workflow never runs aws apprunner start-deployment and has no deploy job.
# Cloud publish is only apprunner-deploy.yml (workflow_dispatch + queue-and-wait).
# Local PAYMENT_MODE=demo / next dev / 3011 is not this workflow's default env.
# smoke:product, test:e2e, ast-grep, semgrep, and knip stay off Actions.

name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Lint
    needs: typecheck
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Build and test
    needs: lint
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Typecheck, unit, integration
        run: npm run test:ci

      - name: Payment regression tests
        run: npm run test:payment

      - name: Production missing-configuration rejection test
        env:
          NODE_ENV: production
          APP_ENV: PROD
          PAYMENT_MODE: stripe
          LOCAL_SOCIAL_LOGIN: "0"
        run: |
          npm run start -- -p 8080 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 45); do
            code=$(curl -sS -o /tmp/lg-health.json -w "%{http_code}" http://127.0.0.1:8080/api/health || true)
            if [ "$code" = "503" ]; then
              echo "GET /api/health -> 503: correctly rejects missing production configuration"
              cat /tmp/lg-health.json
              echo
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "health probe did not respond"
            exit 1
          fi

      - name: Optional production configuration check (not deployment acceptance)
        env:
          APP_ENV: PROD
          PAYMENT_MODE: stripe
          LOCAL_SOCIAL_LOGIN: "0"
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_S3_BUCKET: ${{ secrets.DATA_S3_BUCKET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${DATABASE_URL}" ] || [ -z "${STRIPE_SECRET_KEY}" ] || [ -z "${SESSION_SECRET}" ]; then
            echo "::notice::Production credentials unavailable; no live preflight was performed. Deploy SIT requires separate deployed readiness checks."
            exit 0
          fi
          npm run preflight:production
