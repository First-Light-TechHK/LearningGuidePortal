# Actions = tests only（typecheck / unit / integration / test:ci）。
# 对齐云构建形态：node:22 + npm ci + npm run build + next start -p 8080 探活。
# 本 workflow 永不 aws apprunner start-deployment、无 deploy job。
# 云发布只在 apprunner-deploy.yml（workflow_dispatch + 排队等 RUNNING）。
# 本机 PAYMENT_MODE=demo / next dev / 3011 不是本 workflow 默认 env。
# demo e2e 与 smoke:product 不在 Actions（它们断言 DEV+demo，只属于开发者机器）。

name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Cloud build and test
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Cloud builder
        run: npm run build

      - name: Typecheck, unit, integration
        run: npm run test:ci

      - name: Production start /api/health probe
        env:
          NODE_ENV: production
          APP_ENV: PROD
          PAYMENT_MODE: stripe
          LOCAL_SOCIAL_LOGIN: "0"
        run: |
          npm run start -- -p 8080 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 45); do
            code=$(curl -sS -o /tmp/lg-health.json -w "%{http_code}" http://127.0.0.1:8080/api/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "GET /api/health -> $code (503/not-ready is OK without App Runner secrets)"
              cat /tmp/lg-health.json
              echo
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "health probe did not respond"
            exit 1
          fi

      - name: Production preflight
        env:
          APP_ENV: PROD
          PAYMENT_MODE: stripe
          LOCAL_SOCIAL_LOGIN: "0"
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_S3_BUCKET: ${{ secrets.DATA_S3_BUCKET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${DATABASE_URL}" ] || [ -z "${STRIPE_SECRET_KEY}" ] || [ -z "${SESSION_SECRET}" ]; then
            echo "缺 App Runner secrets，不做假绿"
            exit 0
          fi
          npm run preflight:production
