# PPE/PROD. Provision the service and set PPE_APP_RUNNER_SERVICE_ARN / PPE_ORIGIN first.
name: Deploy PPE
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: learning-guide-ppe-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      previous_sha: ${{ steps.prev.outputs.sha }}
      service_arn: ${{ steps.prev.outputs.arn }}
      origin: ${{ steps.prev.outputs.origin }}
      admin_origin: ${{ steps.prev.outputs.admin_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Stamp APP_VERSION
        id: prev
        env:
          APP_RUNNER_SERVICE_ARN: ${{ vars.PPE_APP_RUNNER_SERVICE_ARN }}
          APP_VERSION: ${{ github.sha }}
          PPE_ORIGIN: ${{ vars.PPE_ORIGIN }}
          PPE_ADMIN_ORIGIN: ${{ vars.PPE_ADMIN_ORIGIN }}
        run: |
          if [ -z "${APP_RUNNER_SERVICE_ARN}" ] || [ -z "${PPE_ORIGIN}" ]; then
            echo "PPE App Runner is not provisioned. Set repository variables PPE_APP_RUNNER_SERVICE_ARN and PPE_ORIGIN."
            exit 1
          fi
          previous="$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --query 'Service.SourceConfiguration.CodeRepository.CodeConfiguration.CodeConfigurationValues.RuntimeEnvironmentVariables.APP_VERSION' --output text)"
          echo "sha=${previous}" >> "$GITHUB_OUTPUT"
          echo "arn=${APP_RUNNER_SERVICE_ARN}" >> "$GITHUB_OUTPUT"
          echo "origin=${PPE_ORIGIN}" >> "$GITHUB_OUTPUT"
          echo "admin_origin=${PPE_ADMIN_ORIGIN}" >> "$GITHUB_OUTPUT"
          node scripts/apprunner-set-version.mjs

  verify:
    needs: deploy
    uses: ./.github/workflows/release-verify.yml
    secrets: inherit
    with:
      environment: PPE
      origin: ${{ needs.deploy.outputs.origin }}
      admin_origin: ${{ needs.deploy.outputs.admin_origin }}
      service_arn: ${{ needs.deploy.outputs.service_arn }}
      previous_sha: ${{ needs.deploy.outputs.previous_sha }}
      rollback_mode: force-branch
