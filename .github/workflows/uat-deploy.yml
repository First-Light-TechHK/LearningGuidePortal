name: Deploy UAT
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: learning-guide-uat-release
  cancel-in-progress: false
jobs:
  deploy:
    name: UAT deployment and learner acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Release exact UAT revision and verify against SIT
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-uat.mjs
      - name: Retain acceptance evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-acceptance-${{ github.sha }}
          path: test-results/uat-acceptance/
          retention-days: 30
          if-no-files-found: error
