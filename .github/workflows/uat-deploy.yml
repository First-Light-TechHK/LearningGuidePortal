# UAT. Provision the App Runner service and set variable UAT_APP_RUNNER_SERVICE_ARN first.
name: Deploy UAT
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: learning-guide-uat-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      previous_sha: ${{ steps.prev.outputs.sha }}
      service_arn: ${{ steps.prev.outputs.arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Stamp APP_VERSION
        id: prev
        env:
          APP_RUNNER_SERVICE_ARN: ${{ vars.UAT_APP_RUNNER_SERVICE_ARN }}
          APP_VERSION: ${{ github.sha }}
        run: |
          if [ -z "${APP_RUNNER_SERVICE_ARN}" ]; then
            echo "UAT App Runner is not provisioned. Set repository variable UAT_APP_RUNNER_SERVICE_ARN after the UAT stack exists."
            exit 1
          fi
          previous="$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --query 'Service.SourceConfiguration.CodeRepository.CodeConfiguration.CodeConfigurationValues.RuntimeEnvironmentVariables.APP_VERSION' --output text)"
          echo "sha=${previous}" >> "$GITHUB_OUTPUT"
          echo "arn=${APP_RUNNER_SERVICE_ARN}" >> "$GITHUB_OUTPUT"
          node scripts/apprunner-set-version.mjs

  verify:
    needs: deploy
    uses: ./.github/workflows/release-verify.yml
    secrets: inherit
    with:
      environment: UAT
      origin: https://uat.ilovelearningguide.com
      admin_origin: https://admin.uat.ilovelearningguide.com
      service_arn: ${{ needs.deploy.outputs.service_arn }}
      previous_sha: ${{ needs.deploy.outputs.previous_sha }}
      rollback_mode: force-branch
