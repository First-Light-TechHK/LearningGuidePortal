# DEV only: learning-guide-portal (www + admin.ilovelearningguide.com).
# SIT is sit-deploy.yml and stays workflow_dispatch.
# Wait on describe-service Status, not list-operations. The deploy IAM user can
# start-deployment and describe-service; list-operations returns empty and the
# previous wait printed Status=unknown until the 30m timeout while App Runner
# itself succeeded.

name: Deploy DEV

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: learning-guide-dev-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Start DEV App Runner deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'First-Light-TechHK/LearningGuidePortal'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Queue-wait until RUNNING, then start-deployment
        env:
          APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
        run: |
          set -u
          echo "DEV target: learning-guide-portal (www + admin)"
          deadline=$((SECONDS + 1500))
          sleep_s=15

          describe_status() {
            aws apprunner describe-service \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --query 'Service.Status' \
              --output text
          }

          wait_until_running() {
            while [ "$SECONDS" -lt "$deadline" ]; do
              status="$(describe_status || true)"
              echo "App Runner Status=${status:-unknown}"
              case "$status" in
                RUNNING)
                  return 0
                  ;;
                PAUSED|DELETED|DELETE_FAILED|CREATE_FAILED)
                  echo "service is not deployable (Status=$status); not waiting further"
                  return 1
                  ;;
              esac
              echo "not RUNNING; queue/wait ${sleep_s}s"
              sleep "$sleep_s"
            done
            echo "timeout: waited 25m for Status=RUNNING"
            return 1
          }

          operation_id=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! wait_until_running; then
              exit 1
            fi
            if out="$(aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN" 2>&1)"; then
              printf '%s\n' "$out"
              operation_id="$(printf '%s\n' "$out" | jq -r '.OperationId // empty')"
              if [ -z "$operation_id" ]; then
                echo "start-deployment returned no OperationId"
                exit 1
              fi
              echo "start-deployment accepted: OperationId=$operation_id"
              break
            fi
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -Eqi 'InvalidRequestException|isn.?t in RUNNING|not in RUNNING'; then
              echo "start-deployment collided (service not RUNNING); wait and retry"
              sleep "$sleep_s"
              continue
            fi
            echo "start-deployment failed with a non-collision error"
            exit 1
          done
          if [ -z "$operation_id" ]; then
            echo "timeout: waited 25m to accept start-deployment"
            exit 1
          fi

          seen_progress=0
          progress_deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$progress_deadline" ]; do
            status="$(describe_status || true)"
            echo "App Runner Status=${status:-unknown} (waiting to leave RUNNING)"
            if [ "$status" != "RUNNING" ]; then
              seen_progress=1
              break
            fi
            sleep 5
          done
          if [ "$seen_progress" != "1" ]; then
            echo "service stayed RUNNING after start-deployment; treating as already applied"
          fi

          deadline=$((SECONDS + 1500))
          if ! wait_until_running; then
            exit 1
          fi

          service_url="$(aws apprunner describe-service \
            --service-arn "$APP_RUNNER_SERVICE_ARN" \
            --query 'Service.ServiceUrl' \
            --output text)"
          health_url="https://${service_url}/api/health"
          health_deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$health_deadline" ]; do
            if health="$(curl --fail --silent --show-error "$health_url")"; then
              printf '%s\n' "$health"
              echo "DEV deployment completed and health check passed"
              exit 0
            fi
            echo "DEV health check not ready; retrying in ${sleep_s}s"
            sleep "$sleep_s"
          done
          echo "DEV health check did not pass within 3m: $health_url"
          exit 1
