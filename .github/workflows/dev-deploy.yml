# DEV only: learning-guide-portal (www + admin.ilovelearningguide.com).
# Push to `dev` publishes DEV. Native GitHub-source auto-deploy does not fire
# reliably on this service, so this workflow is the automatic publisher.
# Do not start it on `main`; that would publish `dev` HEAD.
# After RUNNING, stamp APP_VERSION, then live e2e / fallback / notify.

name: Deploy DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: learning-guide-dev-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Start DEV App Runner deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'First-Light-TechHK/LearningGuidePortal'
    outputs:
      previous_sha: ${{ steps.prev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Queue-wait until RUNNING, then stamp APP_VERSION
        id: prev
        env:
          APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
          APP_VERSION: ${{ github.sha }}
        run: |
          set -u
          echo "DEV target: learning-guide-portal (www + admin)"
          deadline=$((SECONDS + 1500))
          sleep_s=15

          describe_status() {
            aws apprunner describe-service \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --query 'Service.Status' \
              --output text
          }

          wait_until_running() {
            while [ "$SECONDS" -lt "$deadline" ]; do
              status="$(describe_status || true)"
              echo "App Runner Status=${status:-unknown}"
              case "$status" in
                RUNNING)
                  return 0
                  ;;
                PAUSED|DELETED|DELETE_FAILED|CREATE_FAILED)
                  echo "service is not deployable (Status=$status); not waiting further"
                  return 1
                  ;;
              esac
              echo "not RUNNING; queue/wait ${sleep_s}s"
              sleep "$sleep_s"
            done
            echo "timeout: waited 25m for Status=RUNNING"
            return 1
          }

          if ! wait_until_running; then
            exit 1
          fi

          previous="$(aws apprunner describe-service \
            --service-arn "$APP_RUNNER_SERVICE_ARN" \
            --query 'Service.SourceConfiguration.CodeRepository.CodeConfiguration.CodeConfigurationValues.RuntimeEnvironmentVariables.APP_VERSION' \
            --output text)"
          echo "previous_sha=${previous}"
          echo "sha=${previous}" >> "$GITHUB_OUTPUT"
          node scripts/apprunner-set-version.mjs

  verify:
    name: Live e2e / fallback / notify
    needs: deploy
    uses: ./.github/workflows/release-verify.yml
    secrets: inherit
    with:
      environment: DEV
      origin: https://www.ilovelearningguide.com
      admin_origin: https://admin.ilovelearningguide.com
      service_arn: arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
      previous_sha: ${{ needs.deploy.outputs.previous_sha }}
      rollback_mode: revert-commit
