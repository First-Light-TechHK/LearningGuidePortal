# DEV only: learning-guide-portal (www + admin.ilovelearningguide.com).
# Push to `dev` publishes DEV. Native GitHub-source auto-deploy does not fire
# reliably on this service, so this workflow is the automatic publisher.
# Do not start it on `main`; that would publish `dev` HEAD.
# After RUNNING, start-deployment pulls and builds the dev branch, then live e2e runs.

name: Deploy DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: learning-guide-dev-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Start DEV App Runner deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'First-Light-TechHK/LearningGuidePortal'
    outputs:
      previous_sha: ${{ steps.prev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Build and deploy the dev branch
        id: prev
        env:
          APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
        run: |
          set -u
          echo "DEV target: learning-guide-portal (www + admin)"
          deadline=$((SECONDS + 1500))
          sleep_s=15

          describe_status() {
            aws apprunner describe-service \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --query 'Service.Status' \
              --output text
          }

          wait_until_running() {
            while [ "$SECONDS" -lt "$deadline" ]; do
              status="$(describe_status || true)"
              echo "App Runner Status=${status:-unknown}"
              case "$status" in
                RUNNING)
                  return 0
                  ;;
                PAUSED|DELETED|DELETE_FAILED|CREATE_FAILED)
                  echo "service is not deployable (Status=$status); not waiting further"
                  return 1
                  ;;
              esac
              echo "not RUNNING; queue/wait ${sleep_s}s"
              sleep "$sleep_s"
            done
            echo "timeout: waited 25m for Status=RUNNING"
            return 1
          }

          if ! wait_until_running; then
            exit 1
          fi

          previous="$(aws apprunner describe-service \
            --service-arn "$APP_RUNNER_SERVICE_ARN" \
            --query 'Service.SourceConfiguration.CodeRepository.CodeConfiguration.CodeConfigurationValues.RuntimeEnvironmentVariables.APP_VERSION' \
            --output text)"
          echo "previous_sha=${previous}"
          echo "sha=${previous}" >> "$GITHUB_OUTPUT"

          operation_id=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! wait_until_running; then
              exit 1
            fi
            if out="$(aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN" --output json 2>&1)"; then
              printf '%s\n' "$out"
              operation_id="$(printf '%s\n' "$out" | jq -r '.OperationId // empty')"
              if [ -z "$operation_id" ]; then
                echo "start-deployment returned no OperationId"
                exit 1
              fi
              echo "start-deployment accepted: OperationId=$operation_id"
              break
            fi
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -Eqi 'InvalidRequestException|isn.?t in RUNNING|not in RUNNING'; then
              echo "start-deployment collided; wait and retry"
              sleep "$sleep_s"
              continue
            fi
            echo "start-deployment failed"
            exit 1
          done
          if [ -z "$operation_id" ]; then
            echo "timeout waiting to accept start-deployment"
            exit 1
          fi

          deadline=$((SECONDS + 1500))
          op_status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            op_status="$(aws apprunner list-operations \
              --service-arn "$APP_RUNNER_SERVICE_ARN" \
              --query "OperationSummaryList[?Id=='${operation_id}'].Status | [0]" \
              --output text)"
            echo "source build ${operation_id} status=${op_status:-unknown}"
            case "$op_status" in
              SUCCEEDED) break ;;
              FAILED|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED)
                echo "source build ${op_status}"
                exit 1
                ;;
            esac
            sleep "$sleep_s"
          done
          if [ "$op_status" != "SUCCEEDED" ]; then
            echo "timeout waiting for the dev branch build"
            exit 1
          fi
          deadline=$((SECONDS + 300))
          if ! wait_until_running; then
            exit 1
          fi

  verify:
    name: Live e2e / fallback / notify
    needs: deploy
    uses: ./.github/workflows/release-verify.yml
    secrets: inherit
    with:
      environment: DEV
      origin: https://www.ilovelearningguide.com
      admin_origin: https://admin.ilovelearningguide.com
      service_arn: arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
      previous_sha: ${{ needs.deploy.outputs.previous_sha }}
      rollback_mode: revert-commit
