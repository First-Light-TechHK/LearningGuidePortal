# DEV only: learning-guide-portal (www + admin.ilovelearningguide.com).
# This file is a new workflow id. The previous apprunner-deploy.yml was
# disabled_manually in GitHub, so push triggers on that file never ran.
# SIT is sit-deploy.yml and stays workflow_dispatch.
# Gate before AWS: Verify / overlay-check / forge-check must be green for this SHA.
# Do not change Verify. Do not add test:io.

name: Deploy DEV

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: learning-guide-dev-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Start DEV App Runner deployment
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == 'First-Light-TechHK/LearningGuidePortal'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require green Verify, overlay-check and forge-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Queue-wait until RUNNING, start-deployment, then wait for the Operation
        env:
          APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
        run: node scripts/release-dev.mjs
