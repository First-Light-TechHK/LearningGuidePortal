# Forge 门（design.md §3.5 的 guard）：checkout 发布针 forge-v1.1.3 → python -m forge check。
# 对 PR：deny_paths（工作流不许从 agent 分支改）、suite_guard（agent 分支不许把套件改成 blocked）、
# docs_sync（改了 suites/inbox/配置要同 PR 改 brief；链接与版本引用有效）、pr-title、overlay validate/cover。
# 另校验 docs/STATE.md 是否与 forge.yaml / 工作流一致。不 live-apply，不 merge，不推。
# 此文件在 forge.yaml deny_paths 里。升针是 Ops 包（非 agent 前缀）。

name: forge-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  forge-check:
    name: forge-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Forge forge-v1.1.3
        uses: actions/checkout@v4
        with:
          repository: LibertychaserUS/AIOps
          ref: forge-v1.1.3
          path: _aiops
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge
        run: |
          pip install -r _aiops/requirements.txt
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/_aiops" >> "$GITHUB_ENV"

      # forge-v1.1.3：事件 × 来源。push 上空 PR_TITLE 锁 HEAD 提交 subject，不再 empty PR title。
      - name: forge check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python -m forge check --root .

      - name: STATE is fresh
        run: python -m forge status --root . --repo ${{ github.repository }} --check-state
