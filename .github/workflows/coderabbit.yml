# CodeRabbit on CI (official headless CLI: https://docs.coderabbit.ai/cli/headless-cli-integration).
# Called from Verify after Lint and before Build and test (needs: chain in ci.yml).
# GitHub App https://github.com/apps/coderabbitai is the primary PR-review path.
# Fail-open only when there is no pull_request context or CODERABBIT_API_KEY is unset.
# Do not add ast-grep / semgrep / knip here.

name: CodeRabbit

on:
  workflow_call:
    inputs:
      event_name:
        description: Caller github.event_name (workflow_call would otherwise hide pull_request)
        required: true
        type: string
      pr_base:
        description: Pull request base branch, empty when the caller is not a pull_request
        required: false
        type: string
        default: ""
    secrets:
      CODERABBIT_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: CodeRabbit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          EVENT_NAME: ${{ inputs.event_name }}
          PR_BASE: ${{ inputs.pr_base }}
        run: |
          set -u
          if [ -z "${CODERABBIT_API_KEY}" ]; then
            echo "CodeRabbit skipped: CODERABBIT_API_KEY is not set."
            echo "Add an Agentic API key at Settings → Secrets and variables → Actions,"
            echo "or install the CodeRabbit GitHub App for pull request reviews."
            exit 0
          fi
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "CodeRabbit skipped: no pull_request context (event=${EVENT_NAME})."
            echo "Reviews run on pull requests; this job still finishes so Build and test can start."
            exit 0
          fi
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.coderabbit/bin:$PATH"
          if ! command -v coderabbit >/dev/null 2>&1; then
            echo "CodeRabbit skipped: CLI binary not found after install."
            exit 0
          fi
          echo "Reviewing pull request against base: ${PR_BASE}"
          coderabbit review --plain --base "${PR_BASE}" --api-key "${CODERABBIT_API_KEY}"
