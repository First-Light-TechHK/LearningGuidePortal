# 正式部署走 ci.yml（test 通过后才 start-deployment）。
# 本文件只留 workflow_dispatch 手动救急，避免双部署（ARCH-02）。

name: Deploy to App Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger App Runner deployment
    runs-on: ubuntu-latest
    if: github.repository == 'First-Light-TechHK/LearningGuidePortal'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Start deployment from main
        run: |
          aws apprunner start-deployment \
            --service-arn arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
