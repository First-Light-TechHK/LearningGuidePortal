# 手动救急部署。禁止 push / pull_request 触发（避免再走云提交）。
# 日常门禁只在 ci.yml（tests only）。本 workflow 必须保持 workflow_dispatch only。

name: Deploy to App Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger App Runner deployment
    runs-on: ubuntu-latest
    if: github.repository == 'First-Light-TechHK/LearningGuidePortal'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Start deployment from main
        run: |
          aws apprunner start-deployment \
            --service-arn arn:aws:apprunner:ap-southeast-1:851987565851:service/learning-guide-portal/73f7ec76f1884c5f936544916a2607ad
