# Called after a DEV/SIT/UAT/PPE App Runner revision is RUNNING.
# Live e2e against the public origin; on failure, rollback then notify.

name: Post-deploy verify

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      origin:
        required: true
        type: string
      admin_origin:
        required: false
        type: string
        default: ""
      service_arn:
        required: true
        type: string
      previous_sha:
        required: false
        type: string
        default: ""
      rollback_mode:
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  verify:
    name: Live e2e / fallback / notify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Run live e2e, rollback on failure, notify
        # after-deploy.mjs exits 1 when smoke fails, including after a rollback. This job must stay red.
        env:
          RELEASE_ENV: ${{ inputs.environment }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PREVIOUS_SHA: ${{ inputs.previous_sha }}
          RELEASE_ORIGIN: ${{ inputs.origin }}
          RELEASE_ADMIN_ORIGIN: ${{ inputs.admin_origin }}
          APP_RUNNER_SERVICE_ARN: ${{ inputs.service_arn }}
          RELEASE_ROLLBACK_MODE: ${{ inputs.rollback_mode }}
          LIVE_TEST_EMAIL: ${{ vars.LIVE_TEST_EMAIL }}
        run: node scripts/after-deploy.mjs
