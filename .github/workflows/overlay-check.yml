# Native Overlay. Do not vendor overlay/. Pin overlay-v1.0.0.
# validate + overlay run (armed only). draft/blocked stay never_red.
# npm ci is only so armed product_command can execute. Do not add test:io to Verify.

name: overlay-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  overlay-check:
    name: overlay-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Overlay overlay-v1.0.0
        uses: actions/checkout@v4
        with:
          repository: LibertychaserUS/AIOps
          ref: overlay-v1.0.0
          path: _aiops
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overlay
        run: |
          pip install -r _aiops/requirements.txt
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/_aiops" >> "$GITHUB_ENV"

      - name: overlay validate
        run: python -m overlay validate --root .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: overlay run
        run: |
          mkdir -p receipts
          python -m overlay run --branch main --root . --workdir . --write-receipt receipts/
