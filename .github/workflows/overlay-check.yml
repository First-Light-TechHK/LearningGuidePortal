# Overlay stays in this workflow. Do not copy AIOps / overlay/ into the product tree.
# Pin overlay-v1.0.0. Checkout that tag into _aiops, validate existing
# overlay.yaml + inbox/ + suites/, then run every suite product_command.
# If this checkout has no tests/io, fetch those files in the runner so
# login/payment actually enter the HTTP chain. Do not skip. Do not mark blocked.
# That run is workflow-owned, not Overlay-armed. Do not write reviewed_by.
# Do not workflow_call Verify. Do not add test:io to Verify.

name: overlay-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  overlay-check:
    name: overlay-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Overlay overlay-v1.0.0
        uses: actions/checkout@v4
        with:
          repository: LibertychaserUS/AIOps
          ref: overlay-v1.0.0
          path: _aiops
          persist-credentials: false

      - name: Fetch tests/io when this checkout lacks them
        if: ${{ hashFiles('tests/io/login.test.ts', 'tests/io/payment.test.ts') == '' }}
        uses: actions/checkout@v4
        with:
          repository: LibertychaserUS/LearningGuidePortal
          ref: cursor/overlay-workflow-run-2e0c
          path: _io_fetch
          persist-credentials: false
          sparse-checkout: |
            tests/io
          sparse-checkout-cone-mode: true

      - name: Place tests/io into the runner tree
        if: ${{ hashFiles('tests/io/login.test.ts', 'tests/io/payment.test.ts') == '' }}
        run: |
          set -euo pipefail
          if [ ! -f _io_fetch/tests/io/login.test.ts ] || [ ! -f _io_fetch/tests/io/payment.test.ts ]; then
            echo "login/payment product_command needs tests/io; fetch failed."
            exit 1
          fi
          mkdir -p tests/io
          cp _io_fetch/tests/io/harness.ts _io_fetch/tests/io/login.test.ts _io_fetch/tests/io/payment.test.ts tests/io/
          echo "placed tests/io from LibertychaserUS/LearningGuidePortal@cursor/overlay-workflow-run-2e0c"
          ls -la tests/io

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overlay
        run: |
          pip install -r _aiops/requirements.txt
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/_aiops" >> "$GITHUB_ENV"

      - name: overlay validate
        run: python -m overlay validate --root .

      - name: overlay select (record only)
        run: |
          mkdir -p receipts
          python -m overlay select --branch main --root . --write-receipt receipts/
          echo "select is a record. workflow still runs every suite product_command."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Run every suite product_command
        run: python .github/scripts/overlay-run-existing.py
