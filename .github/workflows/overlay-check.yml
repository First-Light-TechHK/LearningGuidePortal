# Overlay stays in this workflow. Do not copy AIOps / overlay/ into the product tree.
# Pin overlay-v1.0.0. Checkout that tag into _aiops and validate.
# Discovery of this repo's tests is in .github/scripts/overlay-run-existing.py:
# cases.md ## function_id → tests/io/<suite-id>.test.ts or tests/unit/<id>-*.test.ts.
# That script is the workflow gate, not Overlay select armed.
# Do not scan tests/e2e or tests/integration. Do not add those to Verify.

name: overlay-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  overlay-check:
    name: overlay-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Overlay overlay-v1.0.0
        uses: actions/checkout@v4
        with:
          repository: LibertychaserUS/AIOps
          ref: overlay-v1.0.0
          path: _aiops
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overlay
        run: |
          pip install -r _aiops/requirements.txt
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/_aiops" >> "$GITHUB_ENV"

      - name: overlay validate
        run: python -m overlay validate --root .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Discover Overlay-named tests
        run: python .github/scripts/overlay-run-existing.py --discover --root .

      - name: Run discovered suite tests
        run: python .github/scripts/overlay-run-existing.py --root .
